<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Petualangan Pixel - Game 2D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.wrap{width:min(100vw,1000px);padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.top h1{font-size:clamp(18px,4vw,28px);margin:0;color:#ffe36e}.stats{display:flex;gap:14px;font-weight:800}.gamebox{position:relative;border:3px solid #d7e6ff;border-radius:12px;overflow:hidden;background:#58b9ff;box-shadow:0 12px 40px #0008}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}.help{font-size:13px;opacity:.85;text-align:center;margin:8px 0}.touch{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:12px;user-select:none}.group{display:flex;gap:10px}.ctl{border:2px solid #ffffff88;background:#233b5ee8;color:white;border-radius:16px;min-width:64px;height:58px;font-size:25px;font-weight:900;box-shadow:0 4px 0 #101827;touch-action:none}.ctl:active{transform:translateY(3px);box-shadow:0 1px 0 #101827}.jump{min-width:94px;background:#217a47e8}.actions{display:flex;gap:8px;justify-content:center;margin-top:10px}.actions button{background:#ffe36e;color:#172033;border:0;border-radius:9px;padding:10px 16px;font-weight:800}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#071326b8;padding:18px;text-align:center}.panel{background:#172b48;border:3px solid #ffe36e;border-radius:16px;padding:20px;max-width:380px;box-shadow:0 10px 30px #0008}.panel h2{color:#ffe36e;margin:0 0 8px}.panel button{background:#ffe36e;color:#172033;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:900;margin-top:8px}
@media(min-width:700px){.touch{max-width:440px;margin:12px auto 0}.ctl{height:52px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><h1>⭐ PETUALANGAN PIXEL</h1><div class="stats"><span>🪙 <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span><span>🏁 <b id="level">1</b></span></div></div>
 <div class="gamebox"><canvas id="game" width="900" height="500" aria-label="Game Petualangan Pixel"></canvas>
  <div class="overlay" id="overlay"><div class="panel"><h2 id="ovtitle">Petualangan Pixel</h2><p id="ovtext">Kumpulkan koin, hindari monster dan capai bendera finis!</p><p>PC: ← → untuk bergerak, ↑ / Spasi untuk lompat.<br>HP: gunakan tombol di bawah.</p><button id="start">MULAI MAIN ▶</button></div></div>
 </div>
 <p class="help">Tip: lompat di atas monster untuk mengalahkannya. Jangan jatuh ke jurang!</p>
 <div class="touch"><div class="group"><button class="ctl" id="left" aria-label="Kiri">◀</button><button class="ctl" id="right" aria-label="Kanan">▶</button></div><button class="ctl jump" id="jump">LOMPAT ⤴</button></div>
 <div class="actions"><button id="restart">↻ Ulangi Game</button><button id="pause">Ⅱ Jeda</button></div>
</div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=900,H=500, gravity=.62;
const ui={score:document.getElementById('score'),lives:document.getElementById('lives'),level:document.getElementById('level'),overlay:document.getElementById('overlay'),title:document.getElementById('ovtitle'),text:document.getElementById('ovtext'),start:document.getElementById('start')};
let keys={left:false,right:false},player,coins,enemies,platforms,hazards,camera,score,lives,mode,won,last=0,currentLevel=1;
function reset(){
 score=0;lives=3;camera=0;won=false;mode='ready';
 player={x:55,y:300,w:28,h:38,vx:0,vy:0,onGround:false,inv:0};
 platforms=[
 {x:0,y:420,w:300,h:80},{x:350,y:420,w:230,h:80},{x:630,y:420,w:270,h:80},
 {x:190,y:340,w:100,h:18},{x:390,y:320,w:100,h:18},{x:520,y:265,w:110,h:18},
 {x:700,y:350,w:95,h:18},{x:830,y:300,w:90,h:18},
 {x:970,y:420,w:250,h:80},{x:1040,y:335,w:100,h:18},
 {x:1270,y:420,w:240,h:80},{x:1320,y:335,w:110,h:18},
 {x:1570,y:420,w:300,h:80},{x:1660,y:330,w:110,h:18},
 {x:1920,y:420,w:360,h:80}
 ];
 // Setiap level punya susunan platform dan bahaya yang berbeda.
 hazards=[];
 if(currentLevel===2){
   platforms=[
    {x:0,y:420,w:210,h:80},{x:270,y:420,w:150,h:80},{x:485,y:420,w:115,h:80},
    {x:665,y:420,w:130,h:80},{x:860,y:420,w:140,h:80},{x:1065,y:420,w:125,h:80},
    {x:1260,y:420,w:130,h:80},{x:1460,y:420,w:130,h:80},{x:1660,y:420,w:160,h:80},{x:1900,y:420,w:380,h:80},
    {x:145,y:340,w:75,h:16},{x:315,y:300,w:75,h:16},{x:520,y:335,w:65,h:16},{x:700,y:285,w:75,h:16},
    {x:900,y:330,w:65,h:16},{x:1090,y:270,w:75,h:16},{x:1300,y:325,w:65,h:16},{x:1500,y:275,w:75,h:16},
    {x:1710,y:325,w:65,h:16},{x:1940,y:345,w:80,h:16}
   ];
   hazards=[{x:210,y:420,w:60,h:18},{x:420,y:420,w:65,h:18},{x:600,y:420,w:65,h:18},{x:795,y:420,w:65,h:18},{x:1000,y:420,w:65,h:18},{x:1190,y:420,w:70,h:18},{x:1390,y:420,w:70,h:18},{x:1590,y:420,w:70,h:18},{x:1820,y:420,w:80,h:18}];
 } else if(currentLevel===3){
   platforms=[
    {x:0,y:420,w:155,h:80},{x:220,y:420,w:105,h:80},{x:390,y:420,w:95,h:80},{x:550,y:420,w:95,h:80},
    {x:710,y:420,w:105,h:80},{x:885,y:420,w:95,h:80},{x:1050,y:420,w:100,h:80},{x:1220,y:420,w:95,h:80},
    {x:1390,y:420,w:100,h:80},{x:1560,y:420,w:115,h:80},{x:1745,y:420,w:100,h:80},{x:1920,y:420,w:360,h:80},
    {x:125,y:335,w:65,h:16},{x:275,y:285,w:65,h:16},{x:445,y:330,w:60,h:16},{x:590,y:260,w:65,h:16},
    {x:755,y:320,w:60,h:16},{x:920,y:260,w:65,h:16},{x:1080,y:315,w:60,h:16},{x:1250,y:250,w:65,h:16},
    {x:1420,y:310,w:60,h:16},{x:1590,y:250,w:65,h:16},{x:1770,y:310,w:60,h:16},{x:1960,y:330,w:80,h:16}
   ];
   hazards=[{x:155,y:420,w:65,h:18},{x:325,y:420,w:65,h:18},{x:485,y:420,w:65,h:18},{x:645,y:420,w:65,h:18},{x:815,y:420,w:70,h:18},{x:980,y:420,w:70,h:18},{x:1150,y:420,w:70,h:18},{x:1315,y:420,w:75,h:18},{x:1490,y:420,w:70,h:18},{x:1675,y:420,w:70,h:18},{x:1845,y:420,w:75,h:18}];
 }
 coins=[];[[210,300],[245,300],[410,280],[445,280],[555,225],[590,225],[725,310],[855,260],[1080,295],[1120,295],[1350,295],[1390,295],[1690,290],[1730,290],[1980,370],[2030,370],[2100,370]].forEach(p=>coins.push({x:p[0],y:p[1],got:false}));
 enemies=currentLevel===1?[{x:390,y:390,min:360,max:550,dir:1},{x:1000,y:390,min:990,max:1190,dir:1},{x:1600,y:390,min:1590,max:1830,dir:1}]:currentLevel===2?[{x:290,y:390,min:275,max:405,dir:1,speed:2.1},{x:700,y:390,min:675,max:790,dir:1,speed:2.2},{x:1090,y:390,min:1070,max:1180,dir:1,speed:2.4},{x:1510,y:390,min:1480,max:1580,dir:1,speed:2.3},{x:1730,y:390,min:1690,max:1800,dir:1,speed:2.5}]:[{x:250,y:390,min:230,max:310,dir:1,speed:2.8},{x:420,y:390,min:400,max:470,dir:1,speed:3},{x:740,y:390,min:720,max:800,dir:1,speed:3.1},{x:920,y:390,min:900,max:965,dir:1,speed:3.2},{x:1260,y:390,min:1230,max:1300,dir:1,speed:3.3},{x:1600,y:390,min:1570,max:1650,dir:1,speed:3.4},{x:1780,y:390,min:1760,max:1830,dir:1,speed:3.5}];
 ui.score.textContent=score;ui.lives.textContent=lives;ui.level.textContent=String(currentLevel);
 showOverlay('Petualangan Pixel','Kumpulkan koin, hindari monster dan capai bendera finis!','MULAI MAIN ▶');
 draw();
}
function showOverlay(t,txt,btn){ui.title.textContent=t;ui.text.innerHTML=txt;ui.start.textContent=btn;ui.overlay.style.display='flex'}
function hideOverlay(){ui.overlay.style.display='none'}
function start(){if(mode==='over'||mode==='won'){currentLevel=1;reset()} mode='play';hideOverlay();last=performance.now();requestAnimationFrame(loop)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,currentLevel===1?'#39a5ff':currentLevel===2?'#b75bff':'#ff8a4c');g.addColorStop(1,currentLevel===1?'#c9f4ff':currentLevel===2?'#f0d5ff':'#ffe0a3');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant hills
 for(let i=0;i<8;i++){let x=((i*160-camera*.18)%1100+1100)%1100-100;ctx.fillStyle=i%2?'#78c7d6':'#65b5ca';ctx.beginPath();ctx.moveTo(x,360);ctx.lineTo(x+90,180+(i%3)*30);ctx.lineTo(x+210,360);ctx.fill()}
 for(let i=0;i<7;i++){let x=((i*190-camera*.35)%1200+1200)%1200-100;rect(x,335,8,45,'#3c8750');ctx.fillStyle='#2d9b54';ctx.beginPath();ctx.arc(x+5,320,28,0,7);ctx.fill();ctx.beginPath();ctx.arc(x-12,332,20,0,7);ctx.fill()}
}
function drawWorld(){
 platforms.forEach(p=>{let x=p.x-camera;if(x+p.w<-20||x>W+20)return;rect(x,p.y,p.w,p.h,currentLevel===3?'#63352f':currentLevel===2?'#583c77':'#80472b');rect(x,p.y,p.w,8,currentLevel===3?'#ff5b36':currentLevel===2?'#b86cff':'#45c94f');rect(x,p.y+8,p.w,5,'#2a8c43');for(let bx=x+8;bx<x+p.w;bx+=28){rect(bx,p.y+22,18,3,'#60351f');rect(bx+8,p.y+38,3,14,'#9d5a32')}});
 hazards.forEach(h=>{let x=h.x-camera;if(x+h.w<0||x>W)return;ctx.fillStyle=currentLevel===3?'#ff402b':'#d9e5f5';for(let sx=x;sx<x+h.w;sx+=16){ctx.beginPath();ctx.moveTo(sx,h.y+h.h);ctx.lineTo(sx+8,h.y);ctx.lineTo(sx+16,h.y+h.h);ctx.fill()}});
 // finish flag
 let fx=2180-camera;rect(fx,300,7,120,'#70452b');ctx.fillStyle='#ff4b59';ctx.beginPath();ctx.moveTo(fx+7,302);ctx.lineTo(fx+62,318);ctx.lineTo(fx+7,338);ctx.fill();
 coins.forEach(c=>{if(c.got)return;let x=c.x-camera;ctx.fillStyle='#ffb900';ctx.beginPath();ctx.ellipse(x,c.y,10,14,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff06a';ctx.lineWidth=3;ctx.stroke();rect(x-2,c.y-7,4,14,'#fff08a')});
 enemies.forEach(e=>{let x=e.x-camera;rect(x,e.y+9,30,22,'#e74750');rect(x+4,e.y+3,22,12,'#fa6868');rect(x+6,e.y+11,5,7,'#fff');rect(x+19,e.y+11,5,7,'#fff');rect(x+8,e.y+13,3,5,'#222');rect(x+21,e.y+13,3,5,'#222');rect(x+3,e.y+29,7,5,'#8e2935');rect(x+21,e.y+29,7,5,'#8e2935')});
 // player pixel hero
 let x=player.x-camera,y=player.y;
 rect(x+6,y,17,10,'#472b24');rect(x+2,y+6,23,8,'#472b24');rect(x+7,y+10,17,14,'#ffd0a0');rect(x+19,y+13,3,4,'#20253a');rect(x+4,y+24,22,11,'#2867cf');rect(x+1,y+27,7,8,'#ffd0a0');rect(x+7,y+35,7,7,'#302f52');rect(x+19,y+35,7,7,'#302f52');rect(x+2,y+23,6,10,'#ef4444');
}
function draw(){
 drawBackground();drawWorld();
 // HUD in canvas
 ctx.fillStyle='#14233dcc';ctx.fillRect(12,12,180,36);ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText('PETUALANGAN PIXEL',22,36);
 ctx.fillStyle='#14233dcc';ctx.fillRect(710,12,175,36);ctx.fillStyle='#ffe36e';ctx.fillText('Koin: '+score,725,36);
 if(mode==='play'){ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.fillText('Capai bendera merah!',W-185,H-16)}
}
function loseLife(){if(player.inv>0)return;lives--;ui.lives.textContent=lives;player.inv=90;player.vy=-7;player.vx=-3;if(lives<=0){mode='over';showOverlay('Game Over 😵','Yah, nyawa lu habis! Skor akhir: <b>'+score+'</b>. Coba lagi dan kumpulkan lebih banyak koin.','MAIN LAGI ↻')}}
function update(){
 if(mode!=='play')return;
 player.vx=keys.left?-3.5:keys.right?3.5:0;
 player.x=Math.max(0,Math.min(2220,player.x+player.vx));
 player.vy+=gravity;player.y+=player.vy;player.onGround=false;
 platforms.forEach(p=>{if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+18&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true}});
 if(player.inv>0)player.inv--;
 coins.forEach(c=>{if(!c.got&&Math.abs((player.x+player.w/2)-c.x)<22&&Math.abs((player.y+player.h/2)-c.y)<28){c.got=true;score+=10;ui.score.textContent=score}});
 enemies.forEach(e=>{e.x+=e.dir*(e.speed||1.25);if(e.x<e.min||e.x>e.max)e.dir*=-1;
 if(player.x+player.w>e.x&&player.x<e.x+30&&player.y+player.h>e.y+4&&player.y<e.y+34){
   if(player.vy>1&&player.y+player.h<e.y+20){e.x=-500;player.vy=-9;score+=20;ui.score.textContent=score}else loseLife();
 }});
 hazards.forEach(h=>{if(player.x+player.w>h.x&&player.x<h.x+h.w&&player.y+player.h>h.y+2&&player.y+player.h<h.y+h.h+18&&player.y+player.h<=h.y+22){loseLife();player.y=h.y-player.h-2;}});
 if(player.y>H+80){loseLife();player.x=Math.max(30,player.x-80);player.y=250;player.vy=0}
 camera=Math.max(0,Math.min(1400,player.x-260));
 if(player.x>2160){ if(currentLevel<3){ const oldScore=score,oldLives=lives; currentLevel++; reset(); score=oldScore+50; lives=oldLives; ui.score.textContent=score; ui.lives.textContent=lives; ui.level.textContent=String(currentLevel); player.x=55;player.y=300;camera=0; mode='levelup'; showOverlay('LEVEL '+currentLevel+'! 🚀',currentLevel===2?'Awas jurang berduri dan monster makin cepat! Layout platform berubah. Bonus +50 poin!':'MODE SULIT! Banyak duri, pijakan kecil, dan monster supercepat. Bonus +50 poin!','LANJUT ▶'); } else {mode='won';showOverlay('MENANG, COY! 🏆','Lu menamatkan semua 3 level!<br>Skor akhir: <b>'+score+'</b>. Keren!','MAIN LAGI ↻')} }
}
function loop(t){if(mode!=='play')return;update();draw();if(mode==='play')requestAnimationFrame(loop)}
function jump(){if(mode==='play'&&player.onGround){player.vy=-12;player.onGround=false}}
function bindHold(id,key){let el=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true};const up=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}
bindHold('left','left');bindHold('right','right');
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key===' '||e.key==='w')jump();if(e.key==='Enter'&&mode!=='play')start()});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});
ui.start.addEventListener('click',start);document.getElementById('restart').addEventListener('click',()=>{currentLevel=1;reset();start()});
document.getElementById('pause').addEventListener('click',()=>{if(mode==='play'){mode='paused';showOverlay('Game Dijeda ⏸','Tarik napas dulu, bro. Tekan lanjut untuk main lagi.','LANJUT ▶')}else if(mode==='paused'||mode==='levelup'){mode='play';hideOverlay();last=performance.now();requestAnimationFrame(loop)}});
reset();
})();
</script>
</body></html>
